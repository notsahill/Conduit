# Conduit local stack.
#
#   docker compose up -d                      # infra only (Postgres + Redis) — the default dev loop
#   ./gradlew bootRun                         #   run the engine on the host against that infra
#
#   docker compose --profile app up --build   # full stack: engine + sample worker + infra (Phase 4+)
#
# Ports: Postgres 5432 · Redis 6379 · engine 8080 (health at /actuator/health).
name: conduit

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: conduit
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- full stack (opt-in): `docker compose --profile app up --build` ---
  # Activates once the app boots end-to-end (Phase 4). Until then use infra-only + `./gradlew bootRun`.
  engine:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/conduit
      SPRING_DATASOURCE_USERNAME: conduit
      SPRING_DATASOURCE_PASSWORD: conduit
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Sample worker joins Redis consumer groups; needs no DB. Wire its main/profile in Phase 4.
      SPRING_PROFILES_ACTIVE: worker
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_started

volumes:
  pgdata:
  redisdata:
